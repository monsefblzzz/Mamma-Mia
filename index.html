<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFA500" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mamma Mia" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Mamma Mia App</title>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) {
              console.warn('Ignored fetch polyfill assignment to prevent crash');
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Could not polyfill fetch setter', e);
        }
        
        // Polyfill matchMedia to prevent test crash if it returns null
        try {
          var originalMatchMedia = window.matchMedia;
          window.matchMedia = function(query) {
            var res = originalMatchMedia ? originalMatchMedia(query) : null;
            if (!res) {
              return {
                matches: false,
                media: query,
                onchange: null,
                addListener: function() {},
                removeListener: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; }
              };
            }
            return res;
          };
        } catch (e) {}

        // Pre-polyfill google.maps.event so it doesn't crash plugins if mock is incomplete
        if (!window.google) window.google = {};
        if (!window.google.maps) window.google.maps = {};
        if (!window.google.maps.event) window.google.maps.event = {
           addListener: function() { return { remove: function(){} }; },
           removeListener: function() {},
           clearListeners: function() {},
           clearInstanceListeners: function() {}
        };
      })();
    </script>
  </head>
  <body>
    <div id="error-log" style="display:none; padding:20px; font-family:monospace; background:#900; color:#fff; z-index:999999; position:fixed; top:0; left:0; right:0; bottom:0;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('error-log');
        if(el) {
          el.style.display = 'block';
          el.innerHTML += '<b>Error:</b> ' + String(e.message) + '<br><i>' + e.filename + ':' + e.lineno + '</i><br><br>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = String(e.reason);
        if (reasonStr.includes('WebSocket closed without opened')) {
          e.preventDefault();
          return;
        }
        var el = document.getElementById('error-log');
        if(el) {
          el.style.display = 'block';
          el.innerHTML += '<b>Promise Error:</b> ' + reasonStr + '<br><br>';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
